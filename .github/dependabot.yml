version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    assignees: [rodrigobdz, alidasmeh]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    assignees: [rodrigobdz, alidasmeh]
    groups:
      hooks:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    assignees: [rodrigobdz, alidasmeh]
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    assignees: [rodrigobdz, alidasmeh]
    ignore:
      # Babel 8 needs every @babel package upgraded together; one-package
      # bumps fail to install against @babel/core 7 (#44).
      - dependency-name: "@babel/*"
        update-types: [version-update:semver-major]
      # typescript-eslint 8 supports TypeScript below 6.1 only; with
      # TypeScript 7 eslint fails to load the plugin (#46). Remove once
      # typescript-eslint/typescript-eslint#10940 is released.
      - dependency-name: typescript
        versions: [">=6.1.0"]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /dashboard
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    assignees: [rodrigobdz, alidasmeh]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    assignees: [rodrigobdz, alidasmeh]
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    assignees: [rodrigobdz, alidasmeh]
    ignore:
      # backend/pyproject.toml supports Python <3.14, and the dependencies
      # fail to build on 3.15 (#39).
      - dependency-name: python
        versions: [">=3.14"]
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    assignees: [rodrigobdz, alidasmeh]
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /dashboard
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    assignees: [rodrigobdz, alidasmeh]
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
