# Copy to conditions.toml and fill in your values.
# conditions.toml is git-ignored because it names your deployment.

# Where Simple Chat runs. Use the deployment you report in the paper.
backend_url = "http://localhost:8000"
frontend_url = "http://localhost:1234"

# Owner of the benchmark projects that setup_projects.py registers.
requested_by = "you@example.org"

# Same system message for every condition and for the direct baseline.
system_message = "You are a helpful assistant. Follow the requested answer length."

# One block per model/provider combination.
# - provider: openai | azure | together_ai
# - model: value of the `model` query parameter Simple Chat receives
#   (for Azure this is the deployment name)
# - pid: project ID; setup_projects.py creates it and sets its OpenAI backend
# - direct_model: model name for the direct-to-provider baseline (defaults to model)

[[conditions]]
name = "openai-gpt-5.1"
provider = "openai"
model = "gpt-5.1-2025-11-13"
pid = "latency-bench-openai"

[[conditions]]
name = "azure-gpt-5.1"
provider = "azure"
# On Azure this is the deployment name, and the backend only accepts names in
# backend/src/utils/configs.py, so name the deployment gpt-5.1-2025-11-13.
model = "gpt-5.1-2025-11-13"
pid = "latency-bench-azure"

[[conditions]]
name = "together-deepseek-v4.1-flash"
provider = "together_ai"
model = "together_ai-deepseek-ai/DeepSeek-V4.1-Flash"
pid = "latency-bench-together"
direct_model = "deepseek-ai/DeepSeek-V4.1-Flash"
